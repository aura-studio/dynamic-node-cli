environments:
  - name: default
    toolchain:
      os: ubuntu22.04
      arch: amd64v1
      compiler: node22.11.0
      variant: bundle           # "bundle" = esbuild bundle; "full" = full node_modules + zip
    warehouse:
      local: /tmp/warehouse
      remote:
        - s3://mirroring-lambda

procedures:
  - name: my-app
    environment: default
    source:
      module: ./src             # module root or repository path
      package: app              # package path under source.module
      version: latest           # source version tag
    target:
      namespace: myteam
      package: app
      version: v1.0.0
